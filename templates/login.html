<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — ТактиКавай</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/home.css">
  <link rel="stylesheet" href="/static/barbie.css">
  <link rel="stylesheet" href="/static/auth.css">
  <script src="/static/script.js" defer></script>
</head>
<body class="center-page">
  <main class="center-card card">
    <div class="center-emoji">🎀</div>
    <h1 class="center-title">ТактиКавай</h1>
    <p class="center-sub">Штаб розового спецназа. Скажи кодовое слово (и приготовь маникюр).</p>

    {% if notice %}<p class="flash">{{ notice }}</p>{% endif %}
    {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}

    <form method="POST" action="/login" class="auth-form">
      <label>Позывной (email)
        <input type="email" name="username" required maxlength="100" placeholder="barbie@pink.by" autofocus>
      </label>
      <label>Кодовое слово (пароль)
        <input type="password" name="password" required maxlength="64" placeholder="••••••••">
      </label>
      <button type="submit" class="btn btn-primary">Войти в штаб 💖</button>
    </form>

    <p class="switch-line">Ещё не в отряде? <a href="/register">Записаться в спецназ</a></p>
  </main>
</body>
</html>
